<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emonPi/Tx Configuration</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
    <link rel="stylesheet" href="/emontx_config_static/panel.css">
</head>
<body>
    <div id="app" class="container">
        <!-- Translation Error -->
        <div v-if="translationError" class="alert alert-danger" style="margin: 20px; text-align: center;">
            <h2>Failed to load translations</h2>
            <p>Could not load the language files. Please check your installation and try refreshing the page.</p>
        </div>

        <template v-else>
        <div class="header" style="position: relative;">
            <h1>{{ t.title }}</h1>
            <p>{{ t.subtitle }}</p>
            <span style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: 0.8;">v{{ integrationVersion }}</span>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div :class="['status-dot', wsConnected ? 'connected' : 'disconnected']"></div>
                <span>Home Assistant: <strong>{{ wsConnected ? t.connected : t.disconnected }}</strong></span>
            </div>
            <div class="status-item">
                <div :class="['status-dot', emontxConnected ? 'connected' : 'disconnected']"></div>
                <span>emonPi/Tx: <strong>{{ emontxConnected ? t.connected : t.unknown }}</strong></span>
            </div>
            <div class="status-item" v-if="configReceived" style="font-size: 13px;">
                <span>{{ t.config.hardware }}: <strong>{{ device.hardware || '-' }}</strong></span>
                <span style="margin-left: 12px;">{{ t.config.version }}: <strong>{{ device.firmware_version || '-' }}</strong></span>
                <span style="margin-left: 12px;" v-if="device.voltage">{{ t.config.voltageLabel }}: <strong>{{ device.voltage }}</strong></span>
            </div>
            <div class="status-item" style="margin-left: auto;">
                <label style="margin-right: 8px;">{{ t.deviceSelector }}:</label>
                <select v-model="selectedDevice" @change="switchDevice" style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; background: white;">
                    <option v-for="dev in availableDevices" :key="dev" :value="dev">{{ dev }}</option>
                </select>
            </div>
        </div>

        <div class="tabs">
            <div :class="['tab', activeTab === 'config' ? 'active' : '']" @click="activeTab = 'config'" :title="t.tooltips.tabConfig">{{ t.tabs.config }}</div>
            <div :class="['tab', activeTab === 'accumulators' ? 'active' : '']" @click="activeTab = 'accumulators'" :title="t.tooltips.tabAccumulators">{{ t.tabs.accumulators }}</div>
            <div :class="['tab', activeTab === 'data' ? 'active' : '']" @click="activeTab = 'data'" :title="t.tooltips.tabLiveData">{{ t.tabs.liveData }}</div>
            <div :class="['tab', activeTab === 'terminal' ? 'active' : '']" @click="activeTab = 'terminal'" :title="t.tooltips.tabTerminal">{{ t.tabs.terminal }}</div>
        </div>

        <!-- Device Configuration Tab -->
        <config-tab
            v-show="activeTab === 'config'"
            :device="device"
            :t="t"
            :emontx-connected="emontxConnected"
            :config-received="configReceived"
            :upgrade-required="upgradeRequired"
            :has-unsaved-changes="hasUnsavedChanges"
            :has-pending-changes="hasPendingChanges"
            :pending-changes-count="pendingChangesList.length"
            :apply-progress="applyProgress"
            :original-device="originalDevice"
            :changes="changes"
            :live-data="liveData"
            :cts-available="ctsAvailable"
            :failed-ct-indices="failedCtIndices"
            :failed-ct-fields="failedCtFields"
            :failed-vcal-indices="failedVcalIndices"
            :channel-names="channelNames"
            @load-config="loadConfig"
            @save-config="saveConfig"
            @apply-changes="applyAllChanges"
            @discard-changes="discardChanges"
            @scan-temp-sensors="scanTempSensors"
            @list-temp-sensors="listTempSensors"
            @save-temp-mapping="saveTempMapping"
            @zero-energy="zeroEnergy"
            @reset-defaults="resetDefaults"
            @generate-yaml="generateYaml"
            @open-bulk-ct="openBulkCtModal"
            @update-channel-name="updateChannelName"
            @export-names="exportChannelNames"
            @import-names="importChannelNames"
        ></config-tab>

        <!-- Serial Terminal Tab -->
        <terminal-tab
            v-show="activeTab === 'terminal'"
            ref="terminal"
            :t="t"
            :emontx-connected="emontxConnected"
            :has-unsaved-changes="hasUnsavedChanges"
            @send-command="writeToStream"
            @save-config="saveConfig"
        ></terminal-tab>

        <!-- Live Data Tab -->
        <live-data-tab
            v-show="activeTab === 'data'"
            :t="t"
            :device="device"
            :live-data="liveData"
            :has-unsaved-changes="hasUnsavedChanges"
            :config-received="configReceived"
            @save-config="saveConfig"
        ></live-data-tab>

        <!-- Accumulators Tab -->
        <accumulators-tab
            v-show="activeTab === 'accumulators'"
            :t="t"
            :device="device"
            :live-data="liveData"
            :emontx-connected="emontxConnected"
            :has-unsaved-changes="hasUnsavedChanges"
            @save-config="saveConfig"
            @zero-energy="zeroEnergy"
            @show-individual-zero="showIndividualZeroConfirm"
        ></accumulators-tab>

        <!-- Modals -->
        <individual-zero-modal
            :show="showIndividualZeroModal"
            :t="t"
            :target="individualZeroTarget"
            @confirm="confirmIndividualZero"
            @cancel="cancelIndividualZero"
        ></individual-zero-modal>

        <zero-confirm-modal
            :show="showZeroConfirm"
            :t="t"
            @confirm="confirmZero"
            @cancel="cancelZero"
        ></zero-confirm-modal>

        <yaml-modal
            :show="showYamlModal"
            :t="t"
            :yaml="generatedYaml"
            @close="showYamlModal = false"
        ></yaml-modal>

        <bulk-ct-modal
            :show="showBulkCtModal"
            :t="t"
            :ichannels="device.ichannels"
            :cts-available="ctsAvailable"
            :progress="bulkProgress"
            @apply="applyBulkCtSettings"
            @close="closeBulkModal"
            @reset-progress="bulkProgress = null"
        ></bulk-ct-modal>
        </template>
    </div>

    <!-- Load component scripts -->
    <script src="/emontx_config_static/components/modals.js"></script>
    <script src="/emontx_config_static/components/config-tab.js"></script>
    <script src="/emontx_config_static/components/terminal-tab.js"></script>
    <script src="/emontx_config_static/components/live-data-tab.js"></script>
    <script src="/emontx_config_static/components/accumulators-tab.js"></script>

    <script>
        var app = new Vue({
            el: '#app',
            data: {
                integrationVersion: '1.1.0-beta.7',
                activeTab: (window.parent.localStorage || localStorage).getItem('emontx_active_tab') || 'config',
                wsConnected: false,
                emontxConnected: false,
                emontxStatus: 'Unknown',
                configReceived: false,
                upgradeRequired: false,
                changes: false,
                liveData: {},
                ctsAvailable: [200, 100, 50, 25, 20],
                // Device selection
                selectedDevice: localStorage.getItem('emontx_selected_device') || 'emontx6',
                availableDevices: [],
                // Zero energy confirmation
                showZeroConfirm: false,
                // Individual zero confirmation
                showIndividualZeroModal: false,
                individualZeroTarget: { type: '', channel: 0 },
                // YAML generator
                showYamlModal: false,
                generatedYaml: '',
                generateYamlAfterApply: false,
                // Bulk CT settings
                showBulkCtModal: false,
                bulkProgress: null,  // { current, total, currentCt, error }
                failedCtIndices: [],  // Indices of CTs that failed to apply
                failedCtFields: [],   // Fields that were being applied when failure occurred
                failedVcalIndices: [], // Indices of voltage channels that failed to apply
                // Pending response for sequential commands
                pendingResponse: null,
                // Unsaved changes warning (for flash save)
                hasUnsavedChanges: false,
                // Batch apply mode
                originalDevice: null,
                applyProgress: null,  // { current, total, currentItem }
                // i18n
                lang: 'en',
                translations: {},
                translationsLoaded: false,
                translationError: false,
                device: {
                    firmware: '',
                    firmware_version: '',
                    hardware: '',
                    hardware_rev: '',
                    voltage: '',
                    emon_library: 'emonLibDB',
                    RF: false,
                    rfNode: '',
                    rfGroup: '',
                    rfBand: '868 MHz',
                    rf433High: false,  // true = 433.92 MHz, false = 433.06 MHz
                    rfPower: 25,
                    rfFormat: '',
                    pulse: false,
                    pulsePeriod: '',
                    datalog: '',
                    json: 0,
                    vcal: '',
                    vchannels: [
                        { vcal: 100, vphase: 0, active: true, voltage: '' },
                        { vcal: 100, vphase: 0, active: false, voltage: '' },
                        { vcal: 100, vphase: 0, active: false, voltage: '' }
                    ],
                    ichannels: [],
                    opa: [
                        { active: true, func: 'o', pullUp: true, period: 100 },
                        { active: true, func: 'o', pullUp: true, period: 100 },
                        { active: false, func: 'b', pullUp: false, period: 100 }  // OPA3: pulse only (both edges default)
                    ],
                    tempSensors: []
                },
                // Connection
                hass: null,
                ws: null,
                wsMessageId: 1,
                deviceName: '',
                servicesRequestId: null,
                // Channel names per device (stored in HA config entry)
                // Structure: { "device_name": { ct: {}, voltage: {}, opa: {}, temp: {} }, ... }
                allChannelNames: {},
                // Computed channel names for current device
                channelNames: {
                    ct: {},
                    voltage: {},
                    opa: {},
                    temp: {}
                }
            },
            watch: {
                activeTab(newTab) {
                    (window.parent.localStorage || localStorage).setItem('emontx_active_tab', newTab);
                },
                configReceived(newVal) {
                    if (newVal && !this.originalDevice) {
                        // Store original config after a short delay to ensure all parsing is complete
                        setTimeout(() => {
                            this.originalDevice = JSON.parse(JSON.stringify(this.device));
                        }, 500);
                    }
                }
            },
            computed: {
                t() {
                    return this.translations[this.lang] || this.translations.en || {};
                },
                voltageChannelCount() {
                    if (this.device.hardware === 'emonPi3') {
                        return 3;
                    }
                    const voltage = this.device.voltage || '';
                    if (voltage.includes('3phase')) return 3;
                    if (voltage.includes('2phase')) return 2;
                    return 1;
                },
                hasPendingChanges() {
                    // Use pendingChangesList to determine if there are pending changes
                    return this.pendingChangesList.length > 0;
                },
                pendingChangesList() {
                    // Returns list of what changed for display/apply
                    if (!this.originalDevice) return [];
                    const changes = [];
                    const orig = this.originalDevice;
                    const curr = this.device;

                    // Helper to compare only config fields of vchannel (exclude live data: voltage)
                    const vChannelConfigEqual = (a, b) => {
                        return a.active === b.active &&
                               a.vcal === b.vcal &&
                               a.vphase === b.vphase;
                    };

                    // Helper to compare only config fields of ichannel (exclude live data: power, energy)
                    const iChannelConfigEqual = (a, b) => {
                        return a.active === b.active &&
                               a.ical === b.ical &&
                               a.ilead === b.ilead &&
                               a.vchan1 === b.vchan1 &&
                               a.vchan2 === b.vchan2;
                    };

                    // Check voltage channels (config fields only, exclude live voltage)
                    for (let i = 0; i < curr.vchannels.length; i++) {
                        if (orig.vchannels[i] && !vChannelConfigEqual(curr.vchannels[i], orig.vchannels[i])) {
                            changes.push({ type: 'vchannel', index: i });
                        }
                    }
                    // Check current channels (config fields only, exclude live power/energy)
                    for (let i = 0; i < curr.ichannels.length; i++) {
                        if (orig.ichannels[i] && !iChannelConfigEqual(curr.ichannels[i], orig.ichannels[i])) {
                            changes.push({ type: 'ichannel', index: i });
                        }
                    }
                    // Check OPA channels
                    for (let i = 0; i < curr.opa.length; i++) {
                        if (JSON.stringify(curr.opa[i]) !== JSON.stringify(orig.opa[i])) {
                            changes.push({ type: 'opa', index: i });
                        }
                    }
                    // Check RF settings
                    if (curr.RF !== orig.RF) changes.push({ type: 'radio' });
                    if (curr.rfNode !== orig.rfNode) changes.push({ type: 'rfNode' });
                    if (curr.rfGroup !== orig.rfGroup) changes.push({ type: 'rfGroup' });
                    if (curr.rf433High !== orig.rf433High) changes.push({ type: 'rf433Toggle' });
                    if (curr.rfPower !== orig.rfPower) changes.push({ type: 'rfPower' });
                    // Check misc settings
                    if (curr.datalog !== orig.datalog) changes.push({ type: 'datalog' });
                    if (curr.json !== orig.json) changes.push({ type: 'json' });

                    return changes;
                }
            },
            mounted() {
                this.detectLanguage();
                this.populateChannels(6);
                this.discoverDevices();
                this.initHassConnection();
            },
            methods: {
                // Language detection and translation loading
                async detectLanguage() {
                    let detectedLang = 'en';
                    try {
                        if (window.parent && window.parent.document) {
                            const hassObj = window.parent.document.querySelector('home-assistant');
                            if (hassObj && hassObj.hass && hassObj.hass.language) {
                                const haLang = hassObj.hass.language.split('-')[0];
                                if (['en', 'fr', 'de', 'it'].includes(haLang)) {
                                    detectedLang = haLang;
                                }
                            }
                        }
                    } catch (e) {
                        console.log('Could not detect HA language, using default');
                    }
                    await this.loadTranslations(detectedLang);
                },

                async loadTranslations(lang) {
                    const currentPath = window.location.pathname;
                    const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));

                    try {
                        const enResponse = await fetch(`${basePath}/i18n/en.json`);
                        if (!enResponse.ok) {
                            throw new Error('Failed to load English translations');
                        }
                        this.$set(this.translations, 'en', await enResponse.json());

                        if (lang !== 'en') {
                            const langResponse = await fetch(`${basePath}/i18n/${lang}.json`);
                            if (langResponse.ok) {
                                this.$set(this.translations, lang, await langResponse.json());
                                this.lang = lang;
                            }
                        }
                        this.translationsLoaded = true;
                    } catch (e) {
                        console.error('Failed to load translations:', e);
                        this.translationError = true;
                        this.translationsLoaded = true;
                    }
                },

                // Device discovery and selection
                async discoverDevices() {
                    try {
                        if (!this.hass) {
                            setTimeout(() => this.discoverDevices(), 500);
                            return;
                        }

                        const services = await this.hass.callWS({ type: 'get_services' });
                        const esphomeServices = services.esphome || {};

                        const devices = [];
                        for (const serviceName in esphomeServices) {
                            if (serviceName.endsWith('_send_command')) {
                                const deviceName = serviceName.replace('_send_command', '');
                                devices.push(deviceName);
                            }
                        }

                        if (devices.length > 0) {
                            this.availableDevices = devices;
                            if (!devices.includes(this.selectedDevice)) {
                                this.selectedDevice = devices[0];
                                localStorage.setItem('emontx_selected_device', this.selectedDevice);
                            }
                        } else {
                            this.availableDevices = [this.selectedDevice];
                        }
                    } catch (e) {
                        console.error('Error discovering devices:', e);
                        this.availableDevices = [this.selectedDevice];
                    }
                },

                switchDevice() {
                    localStorage.setItem('emontx_selected_device', this.selectedDevice);
                    this.deviceName = this.selectedDevice;
                    this.configReceived = false;
                    this.emontxConnected = false;
                    this.liveData = {};
                    this.hasUnsavedChanges = false;
                    this.updateChannelNamesForDevice();
                    this.log(`Switched to device: ${this.selectedDevice}`, 'info');
                    this.getDeviceInfo();
                },

                // Home Assistant connection
                initHassConnection() {
                    this.log('Connecting to Home Assistant...', 'info');

                    try {
                        if (window.parent && window.parent.document) {
                            const hassObj = window.parent.document.querySelector('home-assistant');
                            if (hassObj && hassObj.hass && hassObj.hass.connection) {
                                this.hass = hassObj.hass;
                                this.log('Connected via parent hass object', 'info');
                                this.wsConnected = true;
                                this.subscribeToEvents();
                                this.getDeviceInfo();
                                this.loadChannelNames();
                                return;
                            }
                        }
                    } catch (e) {
                        console.log('Could not get hass from parent:', e);
                    }

                    this.log('Falling back to WebSocket connection...', 'info');
                    this.connectWebSocket();
                },

                connectWebSocket() {
                    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${wsProtocol}//${window.location.host}/api/websocket`;
                    this.ws = new WebSocket(wsUrl);

                    this.ws.onopen = () => {
                        this.log('WebSocket connected', 'info');
                    };

                    this.ws.onmessage = (event) => {
                        const msg = JSON.parse(event.data);
                        this.handleWsMessage(msg);
                    };

                    this.ws.onerror = (error) => {
                        this.log('WebSocket error', 'error');
                        this.wsConnected = false;
                    };

                    this.ws.onclose = () => {
                        this.log('WebSocket closed, reconnecting...', 'error');
                        this.wsConnected = false;
                        setTimeout(() => this.connectWebSocket(), 5000);
                    };
                },

                handleWsMessage(msg) {
                    switch (msg.type) {
                        case 'auth_required':
                            this.authenticateWebSocket();
                            break;
                        case 'auth_ok':
                            this.log('Authenticated with Home Assistant', 'info');
                            this.wsConnected = true;
                            this.subscribeToEvents();
                            this.getDeviceInfo();
                            break;
                        case 'auth_invalid':
                            this.log('Authentication failed', 'error');
                            this.wsConnected = false;
                            break;
                        case 'result':
                            if (msg.id === this.servicesRequestId && msg.success && msg.result && typeof msg.result === 'object') {
                                this.findEmontxDevice(msg.result);
                            }
                            break;
                        case 'event':
                            if (msg.event && msg.event.event_type === 'esphome.emontx_raw') {
                                this.handleEmontxData(msg.event.data);
                            }
                            break;
                    }
                },

                authenticateWebSocket() {
                    let token = null;
                    try {
                        if (window.parent && window.parent.document) {
                            const hassObj = window.parent.document.querySelector('home-assistant');
                            if (hassObj && hassObj.hass && hassObj.hass.auth && hassObj.hass.auth.data) {
                                token = hassObj.hass.auth.data.access_token;
                            }
                        }
                    } catch (e) {}

                    if (token) {
                        this.ws.send(JSON.stringify({ type: 'auth', access_token: token }));
                    } else {
                        this.log('No authentication token available', 'error');
                    }
                },

                subscribeToEvents() {
                    if (this.hass && this.hass.connection) {
                        this.hass.connection.subscribeEvents(
                            (event) => {
                                this.handleEmontxData(event.data);
                            },
                            'esphome.emontx_raw'
                        ).catch((err) => {
                            console.error('Failed to subscribe:', err);
                        });
                    } else if (this.ws) {
                        this.ws.send(JSON.stringify({
                            id: this.wsMessageId++,
                            type: 'subscribe_events',
                            event_type: 'esphome.emontx_raw'
                        }));
                    }
                },

                getDeviceInfo() {
                    if (this.hass && this.hass.connection) {
                        this.hass.connection.sendMessagePromise({ type: 'get_services' })
                            .then(result => this.findEmontxDevice(result));
                    } else if (this.ws) {
                        this.servicesRequestId = this.wsMessageId++;
                        this.ws.send(JSON.stringify({
                            id: this.servicesRequestId,
                            type: 'get_services'
                        }));
                    }
                },

                findEmontxDevice(services) {
                    if (services.esphome) {
                        const serviceName = `${this.selectedDevice}_send_command`;
                        if (services.esphome[serviceName]) {
                            this.deviceName = this.selectedDevice;
                            this.log(`Found device: ${this.deviceName}`, 'info');
                            this.emontxConnected = true;
                            this.emontxStatus = 'Connected';
                            setTimeout(() => this.loadConfig(), 1000);
                            return;
                        }
                    }
                    this.log(`Device ${this.selectedDevice} not found`, 'error');
                },

                // Data handling
                handleEmontxData(data) {
                    if (data.device_id && data.device_id !== this.selectedDevice) {
                        return;
                    }

                    let line = '';
                    if (data.line) {
                        line = data.line;
                    } else if (typeof data === 'string') {
                        line = data;
                    } else {
                        return;
                    }

                    this.log('RX: ' + line);

                    if (line.includes('unsaved changes') || line.includes('Unsaved changes')) {
                        this.hasUnsavedChanges = true;
                    }

                    if (line.includes('settings saved') || line.includes('Settings saved')) {
                        this.hasUnsavedChanges = false;
                    }

                    const sensorRegex = /"?(\w+)"?\s*:\s*"?([^",}\s]+)"?/g;
                    let match;
                    const sensorData = {};
                    let firstKey = null;

                    while ((match = sensorRegex.exec(line)) !== null) {
                        const key = match[1];
                        const value = match[2];
                        if (firstKey === null) firstKey = key;
                        const numValue = parseFloat(value);
                        sensorData[key] = isNaN(numValue) ? value : numValue;
                    }

                    if (firstKey === 'MSG') {
                        this.liveData = sensorData;
                        this.emontxConnected = true;
                        this.emontxStatus = 'Connected';

                        // Update voltage channels with live voltage data
                        for (let v = 0; v < this.device.vchannels.length; v++) {
                            const vKey = 'V' + (v + 1);
                            if (sensorData[vKey] !== undefined) {
                                this.$set(this.device.vchannels[v], 'voltage', sensorData[vKey] + ' V');
                            }
                        }

                        // Update current channels with live power/energy data
                        for (let c = 0; c < this.device.ichannels.length; c++) {
                            const pKey = 'P' + (c + 1);
                            const eKey = 'E' + (c + 1);
                            if (sensorData[pKey] !== undefined) {
                                this.$set(this.device.ichannels[c], 'power', sensorData[pKey] + ' W');
                            }
                            if (sensorData[eKey] !== undefined) {
                                this.$set(this.device.ichannels[c], 'energy', sensorData[eKey] + ' Wh');
                            }
                        }
                    } else if (line.includes(' = ') || line.includes('> Error:')) {
                        this.processLine(line);
                    }
                },

                processLine(line) {
                    // Check for pending response (used by bulk operations)
                    if (this.pendingResponse) {
                        // Check for success pattern
                        if (line.includes(this.pendingResponse.pattern)) {
                            this.pendingResponse.resolve();
                            this.pendingResponse = null;
                        }
                        // Check for error response (device sends "> Error: " prefix)
                        else if (line.includes('> Error:')) {
                            this.pendingResponse.reject();
                        }
                    }

                    if (line.startsWith('firmware = ')) {
                        this.device.firmware = line.split('=')[1].trim();
                        this.configReceived = true;

                        if (this.device.firmware.includes('6CT')) {
                            this.populateChannels(6);
                        } else if (this.device.firmware.includes('12CT')) {
                            this.populateChannels(12);
                        }
                    }

                    if (line.startsWith('hardware = ')) {
                        this.device.hardware = line.split('=')[1].trim();
                        if (this.device.hardware === 'emonPi3') {
                            this.populateChannels(12);
                        }
                    }

                    if (line.startsWith('hardware_rev = ')) {
                        this.device.hardware_rev = line.split('=')[1].trim();
                    }

                    if (line.startsWith('Settings:')) {
                        this.configReceived = true;
                        this.upgradeRequired = true;
                    }

                    // Parse OPA configuration (opa1, opa2, opa3)
                    // Format: "opa1 active = 1, pulse, pullUp = off, pulsePeriod = 100"
                    const opaMatch = line.match(/^opa([1-3]) (.+)$/);
                    if (opaMatch) {
                        const opaIdx = parseInt(opaMatch[1]) - 1;
                        const content = opaMatch[2].trim();

                        const activeMatch = content.match(/active\s*=\s*(\w+)/);
                        if (activeMatch) {
                            this.$set(this.device.opa[opaIdx], 'active', activeMatch[1] === 'on' || activeMatch[1] === '1');
                        }

                        if (content.includes('onewire')) {
                            this.$set(this.device.opa[opaIdx], 'func', 'o');
                        } else if (content.includes('pulse')) {
                            // Detect edge type: rising, falling, or both
                            let pulseMode = 'b';  // default to both
                            if (content.includes('rising')) {
                                pulseMode = 'r';
                            } else if (content.includes('falling')) {
                                pulseMode = 'f';
                            } else if (content.includes('both')) {
                                pulseMode = 'b';
                            }
                            this.$set(this.device.opa[opaIdx], 'func', pulseMode);

                            const pullUpMatch = content.match(/pullUp\s*=\s*(\w+)/);
                            if (pullUpMatch) {
                                this.$set(this.device.opa[opaIdx], 'pullUp', pullUpMatch[1] === 'on');
                            }

                            const periodMatch = content.match(/pulsePeriod\s*=\s*(\d+)/);
                            if (periodMatch) {
                                this.$set(this.device.opa[opaIdx], 'period', parseInt(periodMatch[1]));
                            }
                        }
                    }

                    // Parse temperature sensor list
                    const tempMatch = line.match(/^(\d+)\s+\[->\s*(\d+)\s*\]\s+(.+)$/);
                    if (tempMatch) {
                        const idx = parseInt(tempMatch[2]) - 1;
                        const addr = tempMatch[3].trim();
                        while (this.device.tempSensors.length <= idx) {
                            this.device.tempSensors.push({ addr: '' });
                        }
                        this.$set(this.device.tempSensors, idx, { addr: addr });
                    }

                    // Parse accumulator values
                    const energyMatch = line.match(/^\s*E(\d+)\s*=\s*(-?\d+)\s*Wh/);
                    if (energyMatch) {
                        const key = 'E' + energyMatch[1];
                        const val = parseInt(energyMatch[2]);
                        this.$set(this.liveData, key, val);
                    }
                    const pulseMatch = line.match(/^\s*pulse(\d+)\s*=\s*(\d+)/);
                    if (pulseMatch) {
                        const key = 'pulse' + pulseMatch[1];
                        const val = parseInt(pulseMatch[2]);
                        this.$set(this.liveData, key, val);
                    }

                    // Parse key=value pairs
                    const sublines = line.split(',');
                    for (const subline of sublines) {
                        const keyval = subline.split('=');
                        if (keyval.length === 2) {
                            const key = keyval[0].trim();
                            const val = keyval[1].trim();

                            if (key.startsWith('iCal')) {
                                this.configReceived = true;
                                const c = parseInt(key.substring(4).trim()) - 1;
                                if (c >= 0 && c < this.device.ichannels.length) {
                                    this.device.ichannels[c].ical = Math.round(parseFloat(val));
                                }
                            }
                            else if (key.startsWith('iLead')) {
                                const c = parseInt(key.substring(5).trim()) - 1;
                                if (c >= 0 && c < this.device.ichannels.length) {
                                    this.device.ichannels[c].ilead = parseFloat(val);
                                }
                            }
                            else if (key.startsWith('iActive')) {
                                const c = parseInt(key.substring(7).trim()) - 1;
                                if (c >= 0 && c < this.device.ichannels.length) {
                                    this.$set(this.device.ichannels[c], 'active', val === 'on' || val === '1');
                                }
                            }
                            else if (key.startsWith('v1Chan')) {
                                const c = parseInt(key.substring(6).trim()) - 1;
                                if (c >= 0 && c < this.device.ichannels.length) {
                                    this.$set(this.device.ichannels[c], 'vchan1', parseInt(val));
                                }
                            }
                            else if (key.startsWith('v2Chan')) {
                                const c = parseInt(key.substring(6).trim()) - 1;
                                if (c >= 0 && c < this.device.ichannels.length) {
                                    this.$set(this.device.ichannels[c], 'vchan2', parseInt(val));
                                }
                            }
                            else if (key === 'vCal') {
                                this.device.vcal = parseFloat(val);
                            }
                            else if (key.startsWith('vCal') && key.length > 4) {
                                const c = parseInt(key.substring(4).trim()) - 1;
                                if (c >= 0 && c < this.device.vchannels.length) {
                                    this.$set(this.device.vchannels[c], 'vcal', parseFloat(val));
                                }
                            }
                            else if (key.startsWith('vActive')) {
                                const c = parseInt(key.substring(7).trim()) - 1;
                                if (c >= 0 && c < this.device.vchannels.length) {
                                    this.$set(this.device.vchannels[c], 'active', val === 'on' || val === '1');
                                }
                            }
                            else if (key.startsWith('vLead')) {
                                const c = parseInt(key.substring(5).trim()) - 1;
                                if (c >= 0 && c < this.device.vchannels.length) {
                                    this.$set(this.device.vchannels[c], 'vphase', parseFloat(val));
                                }
                            }
                            else if (key === 'version') {
                                this.device.firmware_version = val;
                            }
                            else if (key === 'voltage') {
                                this.device.voltage = val;
                            }
                            else if (key === 'RF') {
                                this.device.RF = val === 'on';
                            }
                            else if (key === 'rfNode') {
                                this.device.rfNode = parseInt(val);
                            }
                            else if (key === 'rfGroup') {
                                this.device.rfGroup = parseInt(val);
                            }
                            else if (key === 'rfBand') {
                                this.device.rfBand = val;
                                // Set rf433High based on which 433 MHz variant
                                // rf433High=false means 433.92 MHz (x0), rf433High=true means 433.00 MHz (x1)
                                if (val.includes('433.00') || val.includes('433 MHz')) {
                                    this.device.rf433High = true;  // 433.00 MHz
                                } else if (val.includes('433.92')) {
                                    this.device.rf433High = false;  // 433.92 MHz
                                }
                            }
                            else if (key === 'rfPower') {
                                this.device.rfPower = parseInt(val);
                            }
                            else if (key === 'rfFormat') {
                                this.device.rfFormat = val;
                            }
                            else if (key === 'pulse') {
                                this.device.pulse = val !== 'off';
                            }
                            else if (key === 'pulsePeriod') {
                                this.device.pulsePeriod = parseInt(val);
                            }
                            else if (key === 'datalog') {
                                this.device.datalog = parseFloat(val);
                            }
                            else if (key === 'json') {
                                this.device.json = val === 'off' ? 0 : 1;
                            }
                        }
                    }
                },

                populateChannels(num) {
                    this.device.ichannels = [];
                    for (let i = 0; i < num; i++) {
                        this.device.ichannels.push({
                            active: true,
                            ical: 20,
                            ilead: 0.0,
                            vchan1: 1,
                            vchan2: 1,
                            power: '',
                            energy: ''
                        });
                    }
                },

                // Command sending
                writeToStream(cmd) {
                    if (!this.deviceName || (!this.hass && !this.ws)) {
                        this.log('Not connected', 'error');
                        return;
                    }
                    this.log('TX: ' + cmd, 'sent');

                    if (this.hass && this.hass.callService) {
                        this.hass.callService('esphome', this.deviceName + '_send_command', { command: cmd });
                    } else if (this.ws) {
                        this.ws.send(JSON.stringify({
                            id: this.wsMessageId++,
                            type: 'call_service',
                            domain: 'esphome',
                            service: this.deviceName + '_send_command',
                            service_data: { command: cmd }
                        }));
                    }
                },

                // Configuration methods
                loadConfig() {
                    // Clear error highlighting when reloading config
                    this.failedCtIndices = [];
                    this.failedCtFields = [];
                    this.failedVcalIndices = [];
                    this.writeToStream('l');
                },
                async applyAllChanges() {
                    const changes = this.pendingChangesList;
                    if (changes.length === 0) return;

                    // Clear previous error highlighting
                    this.failedCtIndices = [];
                    this.failedCtFields = [];
                    this.failedVcalIndices = [];

                    this.applyProgress = { current: 0, total: changes.length, currentItem: '' };
                    this.log(`Applying ${changes.length} configuration changes...`, 'info');

                    const successfulChanges = [];
                    const failedChanges = [];

                    for (let i = 0; i < changes.length; i++) {
                        const change = changes[i];
                        this.applyProgress = { current: i, total: changes.length, currentItem: this.getChangeLabel(change) };

                        try {
                            // Get the acknowledgment pattern for this change type
                            const ackPattern = this.getAckPattern(change);
                            const responsePromise = ackPattern ? this.waitForResponse(ackPattern) : null;

                            // Send the command
                            this.applyChange(change);

                            // Wait for acknowledgment if pattern is defined
                            if (responsePromise) {
                                await responsePromise;
                            }
                            this.log(`Applied: ${this.getChangeLabel(change)}`, 'info');
                            successfulChanges.push(change);
                        } catch (e) {
                            this.log(`Failed to apply: ${this.getChangeLabel(change)} (timeout or rejected)`, 'error');
                            failedChanges.push(change);
                        }
                    }

                    // Update originalDevice only for successful changes
                    if (successfulChanges.length > 0) {
                        for (const change of successfulChanges) {
                            this.markChangeAsApplied(change);
                        }
                    }

                    // Track failed changes for error highlighting
                    for (const change of failedChanges) {
                        if (change.type === 'vchannel') {
                            this.failedVcalIndices.push(change.index);
                        } else if (change.type === 'ichannel') {
                            this.failedCtIndices.push(change.index);
                            // Mark all ichannel fields as failed
                            this.failedCtFields = ['ical', 'ilead', 'vchan1', 'vchan2'];
                        }
                    }

                    // Show summary
                    const statusItem = failedChanges.length > 0
                        ? `${successfulChanges.length}/${changes.length} applied, ${failedChanges.length} failed`
                        : 'Done';
                    this.applyProgress = { current: changes.length, total: changes.length, currentItem: statusItem };

                    if (failedChanges.length > 0) {
                        this.log(`Applied ${successfulChanges.length}/${changes.length} changes, ${failedChanges.length} failed`, 'warning');
                    } else {
                        this.log(`Applied ${successfulChanges.length} changes`, 'info');
                    }

                    setTimeout(() => {
                        this.applyProgress = null;

                        // Check if YAML generation was requested before apply
                        if (this.generateYamlAfterApply) {
                            this.generateYamlAfterApply = false;
                            if (failedChanges.length > 0) {
                                alert(this.t.yamlModal.fixErrorsFirst);
                            } else {
                                this.generateYaml();
                            }
                        }
                    }, failedChanges.length > 0 ? 2000 : 500);
                },
                markChangeAsApplied(change) {
                    // Update originalDevice for this specific change so it's no longer pending
                    // Use $set for arrays to ensure Vue 2 reactivity
                    if (!this.originalDevice) return;

                    switch (change.type) {
                        case 'vchannel':
                            if (this.originalDevice.vchannels && this.device.vchannels) {
                                this.$set(this.originalDevice.vchannels, change.index, JSON.parse(JSON.stringify(this.device.vchannels[change.index])));
                            }
                            break;
                        case 'ichannel':
                            if (this.originalDevice.ichannels && this.device.ichannels) {
                                this.$set(this.originalDevice.ichannels, change.index, JSON.parse(JSON.stringify(this.device.ichannels[change.index])));
                            }
                            break;
                        case 'opa':
                            if (this.originalDevice.opa && this.device.opa) {
                                this.$set(this.originalDevice.opa, change.index, JSON.parse(JSON.stringify(this.device.opa[change.index])));
                            }
                            break;
                        case 'radio':
                            this.$set(this.originalDevice, 'RF', this.device.RF);
                            break;
                        case 'rfNode':
                            this.$set(this.originalDevice, 'rfNode', this.device.rfNode);
                            break;
                        case 'rfGroup':
                            this.$set(this.originalDevice, 'rfGroup', this.device.rfGroup);
                            break;
                        case 'rf433Toggle':
                            this.$set(this.originalDevice, 'rf433High', this.device.rf433High);
                            break;
                        case 'rfPower':
                            this.$set(this.originalDevice, 'rfPower', this.device.rfPower);
                            break;
                        case 'datalog':
                            this.$set(this.originalDevice, 'datalog', this.device.datalog);
                            break;
                        case 'json':
                            this.$set(this.originalDevice, 'json', this.device.json);
                            break;
                    }
                },
                getAckPattern(change) {
                    // Returns the acknowledgment pattern to wait for after sending a command
                    // Based on firmware response format
                    switch (change.type) {
                        case 'vchannel':
                            return `vCal${change.index + 1} =`;
                        case 'ichannel':
                            return `iCal${change.index + 1} =`;
                        case 'opa':
                            return `opa${change.index + 1} active =`;
                        case 'radio':
                            return 'RF =';
                        case 'rfNode':
                            return 'rfNode =';
                        case 'rfGroup':
                            return 'rfGroup =';
                        case 'rf433Toggle':
                            return 'rfBand =';
                        case 'rfPower':
                            return 'rfPower =';
                        case 'datalog':
                            return 'datalog =';
                        case 'json':
                            return 'json =';
                        default:
                            return null;
                    }
                },
                applyChange(change) {
                    switch (change.type) {
                        case 'vchannel':
                            this.setVchannel(change.index);
                            break;
                        case 'ichannel':
                            this.setIcal(change.index);
                            break;
                        case 'opa':
                            this.setOpa(change.index);
                            break;
                        case 'radio':
                            this.setRadio();
                            break;
                        case 'rfNode':
                            this.setRfNode();
                            break;
                        case 'rfGroup':
                            this.setRfGroup();
                            break;
                        case 'rf433Toggle':
                            this.setRf433Toggle();
                            break;
                        case 'rfPower':
                            this.setRfPower();
                            break;
                        case 'datalog':
                            this.setDatalog();
                            break;
                        case 'json':
                            this.setJson();
                            break;
                    }
                },
                getChangeLabel(change) {
                    switch (change.type) {
                        case 'vchannel': return `V${change.index + 1}`;
                        case 'ichannel': return `CT${change.index + 1}`;
                        case 'opa': return `OPA${change.index + 1}`;
                        case 'radio': return 'RF Enable';
                        case 'rfNode': return 'RF Node';
                        case 'rfGroup': return 'RF Group';
                        case 'rf433Toggle': return 'RF 433 Variant';
                        case 'rfPower': return 'RF Power';
                        case 'datalog': return 'Datalog';
                        case 'json': return 'JSON';
                        default: return change.type;
                    }
                },
                discardChanges() {
                    if (this.originalDevice) {
                        this.device = JSON.parse(JSON.stringify(this.originalDevice));
                        // Clear error highlighting when discarding changes
                        this.failedCtIndices = [];
                        this.failedCtFields = [];
                        this.failedVcalIndices = [];
                        this.log('Changes discarded', 'info');
                    }
                },
                setVcal() {
                    this.writeToStream('k0 ' + parseFloat(this.device.vcal).toFixed(2) + ' 0');
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setVchannel(i) {
                    const active = this.device.vchannels[i].active ? 1 : 0;
                    const vcal = parseFloat(this.device.vchannels[i].vcal).toFixed(2);
                    const vphase = parseFloat(this.device.vchannels[i].vphase || 0).toFixed(2);
                    this.writeToStream('k' + (i + 1) + ' ' + active + ' ' + vcal + ' ' + vphase);
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setIcal(i) {
                    const ical = parseFloat(this.device.ichannels[i].ical).toFixed(2);
                    const ilead = parseFloat(this.device.ichannels[i].ilead || 0).toFixed(2);
                    if (this.device.hardware === 'emonPi3') {
                        const active = this.device.ichannels[i].active ? 1 : 0;
                        this.writeToStream('k' + (i + 4) + ' ' + active + ' ' + ical + ' ' + ilead + ' ' + this.device.ichannels[i].vchan1 + ' ' + this.device.ichannels[i].vchan2);
                    } else {
                        this.writeToStream('k' + (i + 1) + ' ' + ical + ' ' + ilead);
                    }
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                waitForResponse(pattern, timeout = 5000) {
                    return new Promise((resolve, reject) => {
                        const timeoutId = setTimeout(() => {
                            this.pendingResponse = null;
                            reject(new Error('Response timeout'));
                        }, timeout);

                        this.pendingResponse = {
                            pattern: pattern,
                            resolve: () => {
                                clearTimeout(timeoutId);
                                resolve();
                            },
                            reject: () => {
                                clearTimeout(timeoutId);
                                this.pendingResponse = null;
                                reject(new Error('Command rejected'));
                            }
                        };
                    });
                },
                async applyBulkCtSettings(changes) {
                    // Apply values to selected channels one by one, waiting for acknowledgment
                    const total = changes.channels.length;
                    const failedChannels = [];
                    const failedIndices = [];
                    this.failedCtIndices = [];  // Clear previous failures
                    this.failedCtFields = Object.keys(changes.values);  // Track which fields were being applied
                    this.bulkProgress = { current: 0, total: total, currentCt: 0, error: false, failedChannels: [] };
                    this.log(`Applying bulk settings to ${total} channels...`, 'info');

                    for (let i = 0; i < changes.channels.length; i++) {
                        const idx = changes.channels[i];
                        const ctNum = idx + 1;
                        this.bulkProgress = { current: i, total: total, currentCt: ctNum, error: false, failedChannels: failedChannels };

                        if (idx < this.device.ichannels.length) {
                            if (changes.values.ical !== undefined) {
                                this.$set(this.device.ichannels[idx], 'ical', changes.values.ical);
                            }
                            if (changes.values.ilead !== undefined) {
                                this.$set(this.device.ichannels[idx], 'ilead', changes.values.ilead);
                            }
                            if (changes.values.vchan1 !== undefined) {
                                this.$set(this.device.ichannels[idx], 'vchan1', changes.values.vchan1);
                            }
                            if (changes.values.vchan2 !== undefined) {
                                this.$set(this.device.ichannels[idx], 'vchan2', changes.values.vchan2);
                            }

                            // Send command and wait for iCal acknowledgment (only sent if config accepted)
                            try {
                                const responsePromise = this.waitForResponse(`iCal${ctNum} =`);
                                this.setIcal(idx);
                                await responsePromise;
                                this.log(`Configured CT ${ctNum} (${i + 1}/${total})`, 'info');
                                // Update originalDevice so this channel is no longer shown as pending
                                if (this.originalDevice && this.originalDevice.ichannels) {
                                    this.$set(this.originalDevice.ichannels, idx, JSON.parse(JSON.stringify(this.device.ichannels[idx])));
                                }
                            } catch (e) {
                                failedChannels.push(ctNum);
                                failedIndices.push(idx);
                                this.bulkProgress = { ...this.bulkProgress, error: true, failedChannels: failedChannels };
                                this.log(`CT ${ctNum} config rejected (${i + 1}/${total})`, 'error');
                            }
                        }
                    }
                    // Store failed indices for highlighting in UI
                    this.failedCtIndices = failedIndices;
                    // Show completion with error summary if any failed
                    const hasErrors = failedChannels.length > 0;
                    this.bulkProgress = { current: total, total: total, currentCt: 0, error: hasErrors, failedChannels: failedChannels };
                    if (hasErrors) {
                        this.log(`Bulk settings: ${total - failedChannels.length}/${total} applied, failed: CT ${failedChannels.join(', CT ')}`, 'warning');
                    } else {
                        this.log(`Bulk settings applied to ${total} channels`, 'info');
                    }
                    // Close modal after delay only if no errors
                    // If errors, keep modal open so user can see which CTs failed
                    if (!hasErrors) {
                        setTimeout(() => {
                            this.showBulkCtModal = false;
                            this.bulkProgress = null;
                        }, 500);
                    }
                },
                openBulkCtModal() {
                    this.showBulkCtModal = true;
                    this.bulkProgress = null;
                    // Clear previous error highlighting when starting fresh
                    this.failedCtIndices = [];
                    this.failedCtFields = [];
                },
                closeBulkModal() {
                    // Allow closing if not in progress, or if complete (with or without errors)
                    if (!this.bulkProgress || (this.bulkProgress.current === this.bulkProgress.total)) {
                        this.showBulkCtModal = false;
                        this.bulkProgress = null;
                        // Don't clear failedCtIndices/failedCtFields - keep showing errors on main page
                    }
                },
                setRadio() {
                    this.writeToStream('w' + (this.device.RF ? 1 : 0));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setRfNode() {
                    this.writeToStream('n' + Math.round(this.device.rfNode));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setRfGroup() {
                    this.writeToStream('g' + Math.round(this.device.rfGroup));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setRf433Toggle() {
                    // x command: x0 = 433.92 MHz, x1 = 433.00 MHz
                    this.writeToStream('x' + (this.device.rf433High ? '1' : '0'));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setRfPower() {
                    const power = Math.max(0, Math.min(31, Math.round(this.device.rfPower)));
                    this.writeToStream('p' + power);
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setPulse() {
                    this.writeToStream('m' + (this.device.pulse ? '1 ' + this.device.pulsePeriod : '0'));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setPulsePeriod() {
                    this.writeToStream('m1 ' + Math.round(this.device.pulsePeriod));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setDatalog() {
                    this.writeToStream('d' + parseFloat(this.device.datalog));
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setJson() {
                    this.writeToStream('j' + this.device.json);
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                setOpa(idx) {
                    const opa = this.device.opa[idx];
                    const channel = idx + 1;
                    const active = opa.active ? 1 : 0;
                    const funcChar = opa.func;  // 'o' for OneWire, 'r'/'f'/'b' for pulse modes
                    const pullUp = opa.pullUp ? 1 : 0;
                    const period = Math.round(opa.period) || 0;

                    this.writeToStream('m' + channel + ' ' + active + ' ' + funcChar + ' ' + pullUp + ' ' + period);
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                },
                scanTempSensors() {
                    this.device.tempSensors = [];
                    this.writeToStream('of');
                    this.log('Scanning for temperature sensors...', 'info');
                    setTimeout(() => this.listTempSensors(), 2000);
                },
                listTempSensors() {
                    this.writeToStream('ol');
                },
                saveTempMapping() {
                    this.writeToStream('os');
                    this.changes = true;
                    this.hasUnsavedChanges = true;
                    this.log('Temperature sensor mapping saved', 'info');
                },
                saveConfig() {
                    this.writeToStream('s');
                    this.changes = false;
                    this.hasUnsavedChanges = false;
                    this.log('Configuration saved!', 'info');
                },
                resetDefaults() {
                    if (confirm('Reset all settings to default values?')) {
                        this.writeToStream('r');
                        this.changes = true;
                        this.hasUnsavedChanges = true;
                        setTimeout(() => this.loadConfig(), 1000);
                    }
                },
                zeroEnergy() {
                    this.showZeroConfirm = true;
                },
                confirmZero() {
                    this.writeToStream('z');
                    setTimeout(() => {
                        this.writeToStream('y');
                        if (this.device.hardware === 'emonPi3') {
                            setTimeout(() => this.writeToStream('lh'), 1500);
                        }
                    }, 1000);
                    this.showZeroConfirm = false;
                },
                cancelZero() {
                    this.showZeroConfirm = false;
                },
                showIndividualZeroConfirm(type, channel) {
                    this.individualZeroTarget = { type, channel };
                    this.showIndividualZeroModal = true;
                },
                confirmIndividualZero() {
                    const { type, channel } = this.individualZeroTarget;
                    if (type === 'e') {
                        this.writeToStream('ze' + channel);
                    } else if (type === 'p') {
                        this.writeToStream('zp' + channel);
                    }
                    setTimeout(() => {
                        this.writeToStream('y');
                        setTimeout(() => this.writeToStream('lh'), 1500);
                    }, 1000);
                    this.showIndividualZeroModal = false;
                },
                cancelIndividualZero() {
                    this.showIndividualZeroModal = false;
                },

                // YAML Generator
                generateYaml() {
                    // Check if there are pending changes that need to be applied first
                    if (this.hasPendingChanges) {
                        if (confirm(this.t.yamlModal.applyFirst)) {
                            this.generateYamlAfterApply = true;
                            this.applyAllChanges();
                        }
                        return;
                    }

                    let yaml = 'sensor:\n';

                    const numVoltages = this.voltageChannelCount;
                    const voltageLabel = this.t.liveData?.groups?.V || 'Voltage';
                    for (let i = 0; i < numVoltages; i++) {
                        if (this.device.hardware === 'emonPi3' && this.device.vchannels[i] && !this.device.vchannels[i].active) {
                            continue;
                        }
                        const vName = this.channelNames.voltage[String(i + 1)];
                        const defaultVName = numVoltages > 1 ? `${voltageLabel} L${i + 1}` : voltageLabel;
                        yaml += `  - platform: emontx\n`;
                        yaml += `    tag_name: "V${i + 1}"\n`;
                        yaml += `    name: "${vName || defaultVName}"\n`;
                    }

                    for (let i = 0; i < this.device.ichannels.length; i++) {
                        const channel = this.device.ichannels[i];
                        if (this.device.hardware === 'emonPi3' && channel.active === false) {
                            continue;
                        }
                        const ctName = this.channelNames.ct[String(i + 1)];
                        const powerLabel = this.t.config?.power || 'Power';
                        const energyLabel = this.t.config?.energy || 'Energy';
                        const powerName = ctName ? `${ctName} ${powerLabel}` : `${powerLabel} ${i + 1}`;
                        const energyName = ctName ? `${ctName} ${energyLabel}` : `${energyLabel} ${i + 1}`;

                        yaml += `  - platform: emontx\n`;
                        yaml += `    tag_name: "P${i + 1}"\n`;
                        yaml += `    name: "${powerName}"\n`;

                        yaml += `  - platform: emontx\n`;
                        yaml += `    tag_name: "E${i + 1}"\n`;
                        yaml += `    name: "${energyName}"\n`;
                    }

                    // OPA channels (pulse sensors)
                    const pulseLabel = this.t.liveData?.groups?.pulse || 'Pulse';
                    for (let i = 0; i < this.device.opa.length; i++) {
                        const opa = this.device.opa[i];
                        // Only generate for active pulse channels (not OneWire)
                        if (!opa.active || opa.func === 'o') {
                            continue;
                        }
                        const opaName = this.channelNames.opa[String(i + 1)];
                        const sensorName = opaName || `${pulseLabel} ${i + 1}`;

                        yaml += `  - platform: emontx\n`;
                        yaml += `    tag_name: "pulse${i + 1}"\n`;
                        yaml += `    name: "${sensorName}"\n`;
                    }

                    // Temperature sensors
                    const tempLabel = this.t.liveData?.groups?.T || 'Temperature';
                    for (let i = 0; i < this.device.tempSensors.length; i++) {
                        const sensor = this.device.tempSensors[i];
                        const tempName = this.channelNames.temp[sensor.addr];
                        const sensorName = tempName || `${tempLabel} ${i + 1}`;

                        yaml += `  - platform: emontx\n`;
                        yaml += `    tag_name: "T${i + 1}"\n`;
                        yaml += `    name: "${sensorName}"\n`;
                    }

                    this.generatedYaml = yaml;
                    this.showYamlModal = true;
                },

                // Channel names management (per device)
                async loadChannelNames() {
                    try {
                        if (this.hass && this.hass.callWS) {
                            const result = await this.hass.callWS({ type: 'emontx_config/get_channel_names' });
                            if (result && result.channel_names) {
                                this.allChannelNames = result.channel_names;
                                this.updateChannelNamesForDevice();
                                console.log('Loaded channel names:', this.allChannelNames);
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load channel names:', e);
                    }
                },

                updateChannelNamesForDevice() {
                    // Set channelNames for current selected device
                    const deviceNames = this.allChannelNames[this.selectedDevice] || {};
                    this.channelNames = {
                        ct: deviceNames.ct || {},
                        voltage: deviceNames.voltage || {},
                        opa: deviceNames.opa || {},
                        temp: deviceNames.temp || {}
                    };
                },

                async saveChannelNames() {
                    try {
                        if (this.hass && this.hass.callWS) {
                            // Update allChannelNames with current device's names
                            this.$set(this.allChannelNames, this.selectedDevice, JSON.parse(JSON.stringify(this.channelNames)));
                            await this.hass.callWS({
                                type: 'emontx_config/save_channel_names',
                                channel_names: this.allChannelNames
                            });
                            console.log('Saved channel names:', this.allChannelNames);
                        }
                    } catch (e) {
                        console.error('Failed to save channel names:', e);
                    }
                },

                updateChannelName(type, key, name) {
                    // Update a single channel name immediately (to prevent field clearing on re-render)
                    if (!this.channelNames[type]) {
                        this.$set(this.channelNames, type, {});
                    }
                    if (name && name.trim()) {
                        this.$set(this.channelNames[type], key, name.trim());
                    } else {
                        // Remove empty names
                        this.$delete(this.channelNames[type], key);
                    }
                    // Debounce the save to avoid excessive API calls while typing
                    this.debouncedSaveChannelNames();
                },

                debouncedSaveChannelNames() {
                    if (this._saveTimeout) {
                        clearTimeout(this._saveTimeout);
                    }
                    this._saveTimeout = setTimeout(() => {
                        this.saveChannelNames();
                    }, 500);
                },

                exportChannelNames() {
                    const data = {
                        version: 1,
                        exported: new Date().toISOString(),
                        channel_names: this.allChannelNames
                    };
                    const json = JSON.stringify(data, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `emontx-channel-names-${new Date().toISOString().split('T')[0]}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.log('Channel names exported', 'info');
                },

                importChannelNames(file) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (!data.channel_names) {
                                throw new Error('Invalid file format');
                            }
                            this.allChannelNames = data.channel_names;
                            this.updateChannelNamesForDevice();
                            await this.saveChannelNames();
                            this.log('Channel names imported successfully', 'info');
                        } catch (err) {
                            this.log('Failed to import channel names: ' + err.message, 'error');
                        }
                    };
                    reader.readAsText(file);
                },

                // Logging
                log(message, type = '') {
                    if (this.$refs.terminal) {
                        this.$refs.terminal.log(message, type);
                    } else {
                        // Fallback to direct DOM manipulation if terminal ref not ready
                        const terminal = document.getElementById('terminal');
                        if (terminal) {
                            const time = new Date().toLocaleTimeString(this.lang || 'en');
                            const line = document.createElement('div');
                            line.className = type;
                            line.textContent = `[${time}] ${message}`;
                            terminal.appendChild(line);
                            terminal.scrollTop = terminal.scrollHeight;
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
