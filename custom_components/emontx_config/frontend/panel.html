<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emonPi/Tx Configuration</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
    <link rel="stylesheet" href="/emontx_config_static/panel.css">
</head>
<body>
    <div id="app" class="container">
        <!-- Translation Error -->
        <div v-if="translationError" class="alert alert-danger" style="margin: 20px; text-align: center;">
            <h2>Failed to load translations</h2>
            <p>Could not load the language files. Please check your installation and try refreshing the page.</p>
        </div>

        <template v-else>
        <div class="header" style="position: relative;">
            <h1>{{ t.title }}</h1>
            <p>{{ t.subtitle }}</p>
            <span style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: 0.8;">v{{ integrationVersion }}</span>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div :class="['status-dot', wsConnected ? 'connected' : 'disconnected']"></div>
                <span>Home Assistant: <strong>{{ wsConnected ? t.connected : t.disconnected }}</strong></span>
            </div>
            <div class="status-item">
                <div :class="['status-dot', emontxConnected ? 'connected' : 'disconnected']"></div>
                <span>emonPi/Tx: <strong>{{ emontxConnected ? t.connected : t.unknown }}</strong></span>
            </div>
            <div class="status-item" v-if="configReceived" style="font-size: 13px;">
                <span>{{ t.config.hardware }}: <strong>{{ device.hardware || '-' }}</strong></span>
                <span style="margin-left: 12px;">{{ t.config.version }}: <strong>{{ device.firmware_version || '-' }}</strong></span>
                <span style="margin-left: 12px;" v-if="device.voltage">{{ t.config.voltageLabel }}: <strong>{{ device.voltage }}</strong></span>
            </div>
            <div class="status-item" style="margin-left: auto;">
                <label style="margin-right: 8px;">{{ t.deviceSelector }}:</label>
                <select v-model="selectedDevice" @change="switchDevice" style="padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; background: white;">
                    <option v-for="dev in availableDevices" :key="dev" :value="dev">{{ dev }}</option>
                </select>
            </div>
        </div>

        <div class="tabs">
            <div :class="['tab', activeTab === 'config' ? 'active' : '']" @click="activeTab = 'config'" :title="t.tooltips.tabConfig">{{ t.tabs.config }}</div>
            <div :class="['tab', activeTab === 'accumulators' ? 'active' : '']" @click="activeTab = 'accumulators'" :title="t.tooltips.tabAccumulators">{{ t.tabs.accumulators }}</div>
            <div :class="['tab', activeTab === 'data' ? 'active' : '']" @click="activeTab = 'data'" :title="t.tooltips.tabLiveData">{{ t.tabs.liveData }}</div>
            <div :class="['tab', activeTab === 'terminal' ? 'active' : '']" @click="activeTab = 'terminal'" :title="t.tooltips.tabTerminal">{{ t.tabs.terminal }}</div>
        </div>

        <!-- Device Configuration Tab -->
        <config-tab
            v-show="activeTab === 'config'"
            :device="device"
            :t="t"
            :emontx-connected="emontxConnected"
            :config-received="configReceived"
            :upgrade-required="upgradeRequired"
            :has-unsaved-changes="hasUnsavedChanges"
            :has-pending-changes="hasPendingChanges"
            :pending-changes-count="pendingChangesList.length"
            :apply-progress="applyProgress"
            :original-device="originalDevice"
            :changes="changes"
            :live-data="liveData"
            :cts-available="ctsAvailable"
            :failed-ct-indices="failedCtIndices"
            :failed-ct-fields="failedCtFields"
            :failed-vcal-indices="failedVcalIndices"
            :channel-names="channelNames"
            @load-config="loadConfig"
            @save-config="saveConfig"
            @apply-changes="applyAllChanges"
            @discard-changes="discardChanges"
            @scan-temp-sensors="scanTempSensors"
            @list-temp-sensors="listTempSensors"
            @save-temp-mapping="saveTempMapping"
            @zero-energy="zeroEnergy"
            @reset-defaults="resetDefaults"
            @generate-yaml="generateYaml"
            @open-bulk-ct="openBulkCtModal"
            @update-channel-name="updateChannelName"
            @export-names="exportChannelNames"
            @import-names="importChannelNames"
        ></config-tab>

        <!-- Serial Terminal Tab -->
        <terminal-tab
            v-show="activeTab === 'terminal'"
            ref="terminal"
            :t="t"
            :emontx-connected="emontxConnected"
            :has-unsaved-changes="hasUnsavedChanges"
            @send-command="writeToStream"
            @save-config="saveConfig"
        ></terminal-tab>

        <!-- Live Data Tab -->
        <live-data-tab
            v-show="activeTab === 'data'"
            :t="t"
            :device="device"
            :live-data="liveData"
            :has-unsaved-changes="hasUnsavedChanges"
            :config-received="configReceived"
            @save-config="saveConfig"
        ></live-data-tab>

        <!-- Accumulators Tab -->
        <accumulators-tab
            v-show="activeTab === 'accumulators'"
            :t="t"
            :device="device"
            :live-data="liveData"
            :emontx-connected="emontxConnected"
            :has-unsaved-changes="hasUnsavedChanges"
            @save-config="saveConfig"
            @zero-energy="zeroEnergy"
            @show-individual-zero="showIndividualZeroConfirm"
        ></accumulators-tab>

        <!-- Modals -->
        <individual-zero-modal
            :show="showIndividualZeroModal"
            :t="t"
            :target="individualZeroTarget"
            @confirm="confirmIndividualZero"
            @cancel="cancelIndividualZero"
        ></individual-zero-modal>

        <zero-confirm-modal
            :show="showZeroConfirm"
            :t="t"
            @confirm="confirmZero"
            @cancel="cancelZero"
        ></zero-confirm-modal>

        <yaml-modal
            :show="showYamlModal"
            :t="t"
            :yaml="generatedYaml"
            @close="showYamlModal = false"
        ></yaml-modal>

        <bulk-ct-modal
            :show="showBulkCtModal"
            :t="t"
            :ichannels="device.ichannels"
            :cts-available="ctsAvailable"
            :progress="bulkProgress"
            @apply="applyBulkCtSettings"
            @close="closeBulkModal"
            @reset-progress="bulkProgress = null"
        ></bulk-ct-modal>
        </template>
    </div>

    <!-- Load component scripts -->
    <script src="/emontx_config_static/components/modals.js"></script>
    <script src="/emontx_config_static/components/config-tab.js"></script>
    <script src="/emontx_config_static/components/terminal-tab.js"></script>
    <script src="/emontx_config_static/components/live-data-tab.js"></script>
    <script src="/emontx_config_static/components/accumulators-tab.js"></script>

    <!-- Load mixins -->
    <script src="/emontx_config_static/mixins/connection.js"></script>
    <script src="/emontx_config_static/mixins/data-parser.js"></script>
    <script src="/emontx_config_static/mixins/config-commands.js"></script>
    <script src="/emontx_config_static/mixins/yaml-generator.js"></script>
    <script src="/emontx_config_static/mixins/channel-names.js"></script>

    <script>
        var app = new Vue({
            el: '#app',
            mixins: [ConnectionMixin, DataParserMixin, ConfigCommandsMixin, YamlGeneratorMixin, ChannelNamesMixin],
            data: {
                integrationVersion: '1.1.0-beta.10',
                activeTab: (window.parent.localStorage || localStorage).getItem('emontx_active_tab') || 'config',
                wsConnected: false,
                emontxConnected: false,
                emontxStatus: 'Unknown',
                configReceived: false,
                upgradeRequired: false,
                changes: false,
                liveData: {},
                ctsAvailable: [200, 100, 50, 25, 20],
                // Device selection
                selectedDevice: localStorage.getItem('emontx_selected_device') || 'emontx6',
                availableDevices: [],
                // Zero energy confirmation
                showZeroConfirm: false,
                // Individual zero confirmation
                showIndividualZeroModal: false,
                individualZeroTarget: { type: '', channel: 0 },
                // YAML generator
                showYamlModal: false,
                generatedYaml: '',
                generateYamlAfterApply: false,
                // Bulk CT settings
                showBulkCtModal: false,
                bulkProgress: null,  // { current, total, currentCt, error }
                failedCtIndices: [],  // Indices of CTs that failed to apply
                failedCtFields: [],   // Fields that were being applied when failure occurred
                failedVcalIndices: [], // Indices of voltage channels that failed to apply
                // Pending response for sequential commands
                pendingResponse: null,
                // Unsaved changes warning (for flash save)
                hasUnsavedChanges: false,
                // Batch apply mode
                originalDevice: null,
                applyProgress: null,  // { current, total, currentItem }
                // i18n
                lang: 'en',
                translations: {},
                translationsLoaded: false,
                translationError: false,
                device: {
                    firmware: '',
                    firmware_version: '',
                    hardware: '',
                    hardware_rev: '',
                    voltage: '',
                    emon_library: 'emonLibDB',
                    RF: false,
                    rfNode: '',
                    rfGroup: '',
                    rfBand: '868 MHz',
                    rf433High: false,  // true = 433.92 MHz, false = 433.06 MHz
                    rfPower: 25,
                    rfFormat: '',
                    pulse: false,
                    pulsePeriod: '',
                    datalog: '',
                    json: 0,
                    vcal: '',
                    vchannels: [
                        { vcal: 100, vphase: 0, active: true, voltage: '' },
                        { vcal: 100, vphase: 0, active: false, voltage: '' },
                        { vcal: 100, vphase: 0, active: false, voltage: '' }
                    ],
                    ichannels: [],
                    opa: [
                        { active: true, func: 'o', pullUp: true, period: 100 },
                        { active: true, func: 'o', pullUp: true, period: 100 },
                        { active: false, func: 'b', pullUp: false, period: 100 }  // OPA3: pulse only (both edges default)
                    ],
                    tempSensors: []
                },
                // Connection
                hass: null,
                ws: null,
                wsMessageId: 1,
                deviceName: '',
                servicesRequestId: null,
                // Channel names per device (stored in HA config entry)
                // Structure: { "device_name": { ct: {}, voltage: {}, opa: {}, temp: {} }, ... }
                allChannelNames: {},
                // Computed channel names for current device
                channelNames: {
                    ct: {},
                    voltage: {},
                    opa: {},
                    temp: {}
                }
            },
            watch: {
                activeTab(newTab) {
                    (window.parent.localStorage || localStorage).setItem('emontx_active_tab', newTab);
                },
                configReceived(newVal) {
                    if (newVal && !this.originalDevice) {
                        // Store original config after a short delay to ensure all parsing is complete
                        setTimeout(() => {
                            this.originalDevice = JSON.parse(JSON.stringify(this.device));
                        }, 500);
                    }
                }
            },
            computed: {
                t() {
                    return this.translations[this.lang] || this.translations.en || {};
                },
                voltageChannelCount() {
                    if (this.device.hardware === 'emonPi3') {
                        return 3;
                    }
                    const voltage = this.device.voltage || '';
                    if (voltage.includes('3phase')) return 3;
                    if (voltage.includes('2phase')) return 2;
                    return 1;
                },
                hasPendingChanges() {
                    // Use pendingChangesList to determine if there are pending changes
                    return this.pendingChangesList.length > 0;
                },
                pendingChangesList() {
                    // Returns list of what changed for display/apply
                    if (!this.originalDevice) return [];
                    const changes = [];
                    const orig = this.originalDevice;
                    const curr = this.device;

                    // Helper to compare only config fields of vchannel (exclude live data: voltage)
                    const vChannelConfigEqual = (a, b) => {
                        return a.active === b.active &&
                               a.vcal === b.vcal &&
                               a.vphase === b.vphase;
                    };

                    // Helper to compare only config fields of ichannel (exclude live data: power, energy)
                    const iChannelConfigEqual = (a, b) => {
                        return a.active === b.active &&
                               a.ical === b.ical &&
                               a.ilead === b.ilead &&
                               a.vchan1 === b.vchan1 &&
                               a.vchan2 === b.vchan2;
                    };

                    // Check voltage channels (config fields only, exclude live voltage)
                    for (let i = 0; i < curr.vchannels.length; i++) {
                        if (orig.vchannels[i] && !vChannelConfigEqual(curr.vchannels[i], orig.vchannels[i])) {
                            changes.push({ type: 'vchannel', index: i });
                        }
                    }
                    // Check current channels (config fields only, exclude live power/energy)
                    for (let i = 0; i < curr.ichannels.length; i++) {
                        if (orig.ichannels[i] && !iChannelConfigEqual(curr.ichannels[i], orig.ichannels[i])) {
                            changes.push({ type: 'ichannel', index: i });
                        }
                    }
                    // Check OPA channels
                    for (let i = 0; i < curr.opa.length; i++) {
                        if (JSON.stringify(curr.opa[i]) !== JSON.stringify(orig.opa[i])) {
                            changes.push({ type: 'opa', index: i });
                        }
                    }
                    // Check RF settings
                    if (curr.RF !== orig.RF) changes.push({ type: 'radio' });
                    if (curr.rfNode !== orig.rfNode) changes.push({ type: 'rfNode' });
                    if (curr.rfGroup !== orig.rfGroup) changes.push({ type: 'rfGroup' });
                    if (curr.rf433High !== orig.rf433High) changes.push({ type: 'rf433Toggle' });
                    if (curr.rfPower !== orig.rfPower) changes.push({ type: 'rfPower' });
                    // Check misc settings
                    if (curr.datalog !== orig.datalog) changes.push({ type: 'datalog' });
                    if (curr.json !== orig.json) changes.push({ type: 'json' });

                    return changes;
                }
            },
            mounted() {
                this.detectLanguage();
                this.populateChannels(6);
                this.discoverDevices();
                this.initHassConnection();
            },
            methods: {
                // Language detection and translation loading
                async detectLanguage() {
                    let detectedLang = 'en';
                    try {
                        if (window.parent && window.parent.document) {
                            const hassObj = window.parent.document.querySelector('home-assistant');
                            if (hassObj && hassObj.hass && hassObj.hass.language) {
                                const haLang = hassObj.hass.language.split('-')[0];
                                if (['en', 'fr', 'de', 'it'].includes(haLang)) {
                                    detectedLang = haLang;
                                }
                            }
                        }
                    } catch (e) {
                        console.log('Could not detect HA language, using default');
                    }
                    await this.loadTranslations(detectedLang);
                },

                async loadTranslations(lang) {
                    const currentPath = window.location.pathname;
                    const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));

                    try {
                        const enResponse = await fetch(`${basePath}/i18n/en.json`);
                        if (!enResponse.ok) {
                            throw new Error('Failed to load English translations');
                        }
                        this.$set(this.translations, 'en', await enResponse.json());

                        if (lang !== 'en') {
                            const langResponse = await fetch(`${basePath}/i18n/${lang}.json`);
                            if (langResponse.ok) {
                                this.$set(this.translations, lang, await langResponse.json());
                                this.lang = lang;
                            }
                        }
                        this.translationsLoaded = true;
                    } catch (e) {
                        console.error('Failed to load translations:', e);
                        this.translationError = true;
                        this.translationsLoaded = true;
                    }
                },

                // Device discovery and selection
                async discoverDevices() {
                    try {
                        if (!this.hass) {
                            setTimeout(() => this.discoverDevices(), 500);
                            return;
                        }

                        const services = await this.hass.callWS({ type: 'get_services' });
                        const esphomeServices = services.esphome || {};

                        const devices = [];
                        for (const serviceName in esphomeServices) {
                            if (serviceName.endsWith('_send_command')) {
                                const deviceName = serviceName.replace('_send_command', '');
                                devices.push(deviceName);
                            }
                        }

                        if (devices.length > 0) {
                            this.availableDevices = devices;
                            if (!devices.includes(this.selectedDevice)) {
                                this.selectedDevice = devices[0];
                                localStorage.setItem('emontx_selected_device', this.selectedDevice);
                            }
                        } else {
                            this.availableDevices = [this.selectedDevice];
                        }
                    } catch (e) {
                        console.error('Error discovering devices:', e);
                        this.availableDevices = [this.selectedDevice];
                    }
                },

                switchDevice() {
                    localStorage.setItem('emontx_selected_device', this.selectedDevice);
                    this.deviceName = this.selectedDevice;
                    this.configReceived = false;
                    this.emontxConnected = false;
                    this.liveData = {};
                    this.hasUnsavedChanges = false;
                    this.updateChannelNamesForDevice();
                    this.log(`Switched to device: ${this.selectedDevice}`, 'info');
                    this.getDeviceInfo();
                },

                // Methods from mixins are loaded via: ConnectionMixin, DataParserMixin,
                // ConfigCommandsMixin, YamlGeneratorMixin, ChannelNamesMixin

                // Logging
                log(message, type = '') {
                    if (this.$refs.terminal) {
                        this.$refs.terminal.log(message, type);
                    } else {
                        // Fallback to direct DOM manipulation if terminal ref not ready
                        const terminal = document.getElementById('terminal');
                        if (terminal) {
                            const time = new Date().toLocaleTimeString(this.lang || 'en');
                            const line = document.createElement('div');
                            line.className = type;
                            line.textContent = `[${time}] ${message}`;
                            terminal.appendChild(line);
                            terminal.scrollTop = terminal.scrollHeight;
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
